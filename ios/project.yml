# XcodeGen の定義。LatteCoach.xcodeproj はこのファイルから生成する: `cd ios && xcodegen`
name: LatteCoach
options:
  bundleIdPrefix: com.example.lattecoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LatteCoach:
    type: application
    platform: iOS
    sources: [LatteCoach]
    # 署名チーム・バンドル ID・サーバー URL は Config/Local.xcconfig（git 管理外）で設定する
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: LatteCoach/Info.plist
      properties:
        CFBundleDisplayName: スチームコーチ
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: スチームの音から特徴量を計算します。音声そのものは保存も送信もしません。
        NSCameraUsageDescription: 注ぎ終わったピッチャーの残りを1枚撮ります。
        NSPhotoLibraryUsageDescription: 撮影済みのピッチャーの写真を選ぶときに使います。
        CoachServerURL: $(COACH_SERVER_URL)
  LatteCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LatteCoachTests]
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
    dependencies:
      - target: LatteCoach
schemes:
  LatteCoach:
    build:
      targets:
        LatteCoach: all
    test:
      targets: [LatteCoachTests]
