# XcodeGen の定義。LatteCoach.xcodeproj はこのファイルから生成する: `cd ios && xcodegen`
name: LatteCoach
options:
  bundleIdPrefix: com.example.lattecoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # 署名チームは各自の Xcode で設定する（公開リポジトリに入れない）
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  LatteCoach:
    type: application
    platform: iOS
    sources: [LatteCoach]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.lattecoach.app
        TARGETED_DEVICE_FAMILY: "1"
        # 診断サーバーの URL。未設定なら杯は端末に保存するだけ
        COACH_SERVER_URL: ""
    info:
      path: LatteCoach/Info.plist
      properties:
        CFBundleDisplayName: スチームコーチ
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: スチームの音から特徴量を計算します。音声そのものは保存も送信もしません。
        NSCameraUsageDescription: 注ぎ終わったピッチャーの残りを1枚撮ります。
        NSPhotoLibraryUsageDescription: 撮影済みのピッチャーの写真を選ぶときに使います。
        CoachServerURL: $(COACH_SERVER_URL)
  LatteCoachTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LatteCoachTests]
    dependencies:
      - target: LatteCoach
schemes:
  LatteCoach:
    build:
      targets:
        LatteCoach: all
    test:
      targets: [LatteCoachTests]
